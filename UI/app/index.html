<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prism</title>
  <meta name="description" content="Make vertical Shorts from long videos in your browser.">
  <meta name="robots" content="noindex">
  <script>try { var t = localStorage.getItem('prism-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="/app/app.css">
  <script src="/vendor/supabase-2.45.4.js"></script>
  <script src="/supabase-client.js"></script>
  <script src="/beta.js"></script>
  <script src="/turnstile.js"></script>
  <script type="module" src="/app/app.js"></script>
  <!-- Vercel Web Analytics and Speed Insights: cookieless page views and load times. -->
  <script src="/analytics.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand-row"><img src="/icon.png" width="30" height="30" alt=""><span class="brand-name">Prism</span>
        <button class="collapse-button" data-action="collapse" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
      <p class="tagline">Your video editor · Cloud AI</p>
      <nav class="side-nav" aria-label="Main">
        <button class="side-button selected" data-action="nav" data-screen="home" title="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3Z"/></svg><span class="label">Home</span></button>
        <button class="side-button prominent" data-action="nav" data-screen="create" title="Create Shorts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8" class="cut"/></svg><span class="label">Create Shorts</span></button>
      </nav>
      <div class="side-bottom">
        <div id="upload-status" class="upload-status" hidden><span id="upload-text" class="small muted"></span><div class="meter thin"><div id="upload-bar"></div></div></div>
        <button class="side-button" data-action="nav" data-screen="settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg><span class="label">Settings</span></button>
        <div class="resources">
          <p class="muted small">On this device</p>
          <div class="res-line small"><span class="muted">Storage</span><span id="storage-label" class="mono">—</span></div>
          <div class="meter thin"><div id="storage-bar"></div></div>
        </div>
      </div>
    </aside>
    <div class="content">
      <header class="topbar">
        <h1 id="screen-title">Home</h1>
        <span class="topbar-actions">
          <button id="export-button" class="button primary" data-action="export-dialog" hidden>Export</button>
        <div class="theme-toggle" role="group" aria-label="Theme">
          <button id="theme-dark" data-action="theme" data-theme="dark" aria-label="Dark theme" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg></button>
          <button id="theme-light" data-action="theme" data-theme="light" aria-label="Light theme" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
        </div>
        </span>
      </header>
      <main id="app" class="app-main"><p class="muted">Loading…</p></main>
    </div>
  </div>
  <div id="gate" class="gate" hidden></div>
  <div id="drop-overlay" class="drop-overlay" hidden><div><h2>Drop to create Shorts</h2><p>MP4, MOV, WebM or any video your browser can read</p></div></div>
  <div id="progress" class="progress" hidden></div>
  <div id="dialog" class="dialog" hidden></div>
  <noscript><p class="notice">Prism needs JavaScript to make Shorts in your browser.</p></noscript>
</body>
</html>
