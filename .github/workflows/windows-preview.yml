# Runs the real Windows app on a GitHub Windows machine and shows its screen in your browser (TightVNC + noVNC over a Cloudflare tunnel).
# Start it from the Mac with:  zsh Windows/preview.sh   (pushes the current commit to the windows-preview branch)
# Logs are public: the tunnel link is only posted (as a commit status) encrypted with the PREVIEW_PASSWORD secret, which also guards the screen.
name: Windows preview

on:
  push:
    branches: [windows-preview]

permissions:
  contents: read
  statuses: write # carries the encrypted link; annotations only appear once the job ends

concurrency:
  group: windows-preview
  cancel-in-progress: true

jobs:
  # Runs beside the preview: the shared tests on Windows with the release's ffmpeg, including the render and export tests a Mac without ffmpeg skips.
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Add ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName + "\bin"
          "PRISM_FFMPEG=$bin\ffmpeg.exe" >> $env:GITHUB_ENV
          "PRISM_FFPROBE=$bin\ffprobe.exe" >> $env:GITHUB_ENV
      - name: Shared tests
        run: dotnet test Shared/Prism.Core.Tests

  preview:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Publish Prism
        run: dotnet publish Windows/Prism.Windows -c Release -r win-x64 --self-contained -p:DebugType=none -o dist/windows
      - name: Add ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $root = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe", "$($root.FullName)\bin\ffprobe.exe" dist/windows/
      - name: Install the screen server
        shell: pwsh
        run: |
          if (-not $env:PREVIEW_PASSWORD) { throw "The PREVIEW_PASSWORD repository secret is missing; zsh Windows/preview.sh sets it." }
          # Prism opens at 1440x920; the runner's default 1024x768 desktop would clip it.
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Warning "Screen keeps its default size: $_" }
          # Runs as a Windows service, so it outlives this step. Loopback must be allowed: websockify reaches it on localhost.
          choco install tightvnc -y --no-progress --ia "ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$env:PREVIEW_PASSWORD SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1 SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=0"
          python -m pip install --quiet websockify
          Invoke-WebRequest https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip -OutFile novnc.zip
          Expand-Archive novnc.zip -DestinationPath .
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
      # One step on purpose: the runner kills every process a step started when that step ends.
      - name: Run the preview (cancel the run to stop)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Show-Logs { (Get-Content tunnel.log, upload.log) -replace '[a-z0-9-]+\.trycloudflare\.com', '<tunnel>'; Get-Content websockify.log, upload-server.log }
          Start-Process python -ArgumentList "-m", "websockify", "--web", "noVNC-1.5.0", "6080", "localhost:5900" -WindowStyle Hidden -RedirectStandardError websockify.log
          Start-Process ./cloudflared.exe -ArgumentList "tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "--url", "http://127.0.0.1:6080" -WindowStyle Hidden -RedirectStandardError tunnel.log
          # A second tunnel takes videos from preview.sh into the Videos folder, so nothing has to be downloaded on the runner.
          Start-Process python -ArgumentList "Windows/preview-upload.py" -WindowStyle Hidden -RedirectStandardError upload-server.log
          Start-Process ./cloudflared.exe -ArgumentList "tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20242", "--url", "http://127.0.0.1:8090" -WindowStyle Hidden -RedirectStandardError upload.log
          Start-Process dist/windows/Prism.exe -WorkingDirectory dist/windows
          # Checked locally: a brand-new trycloudflare name often fails to resolve on the runner for minutes.
          foreach ($i in 1..45) {
            $ready = curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:20241/ready
            $web = curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:6080/vnc.html
            $uploads = curl.exe -s -o NUL -w '%{http_code}' http://127.0.0.1:20242/ready
            if ("$ready$web$uploads" -eq '200200200') { break }
            Start-Sleep 4
          }
          if ("$ready$web$uploads" -ne '200200200') { Show-Logs; throw "Tunnel ready: $ready, noVNC: $web, uploads: $uploads." }
          $url = (Select-String -Path tunnel.log -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com').Matches[0].Value
          [IO.File]::WriteAllText("$PWD/url.txt", $url)
          $cipher = & "$env:ProgramFiles\Git\usr\bin\openssl.exe" enc -aes-256-cbc -pbkdf2 -md sha256 -a -A -pass env:PREVIEW_PASSWORD -in url.txt
          Remove-Item url.txt
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=success -f "context=windows-preview/$env:GITHUB_RUN_ID" -f "description=$cipher" | Out-Null
          if ($LASTEXITCODE) { throw "Could not post the link." }
          $uploadUrl = (Select-String -Path upload.log -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com').Matches[0].Value
          [IO.File]::WriteAllText("$PWD/url.txt", $uploadUrl)
          $cipher = & "$env:ProgramFiles\Git\usr\bin\openssl.exe" enc -aes-256-cbc -pbkdf2 -md sha256 -a -A -pass env:PREVIEW_PASSWORD -in url.txt
          Remove-Item url.txt
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=success -f "context=windows-preview-upload/$env:GITHUB_RUN_ID" -f "description=$cipher" | Out-Null
          while ($true) {
            foreach ($name in 'tvnserver', 'python', 'cloudflared') {
              if (-not (Get-Process $name -ErrorAction SilentlyContinue)) { Show-Logs; throw "$name stopped." }
            }
            Start-Sleep 60
          }
